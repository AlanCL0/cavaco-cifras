name: Gerar APK de Cavaquinho

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Gerar estrutura Android sem sobrescrever dependencias
        run: |
          # 1. Faz backup do pubspec
          cp pubspec.yaml pubspec.backup.yaml
          
          # 2. Gera os arquivos do Android
          flutter create --platforms=android --project-name cavaco_cifras --org com.cavacoapp .
          
          # 3. Restaura o pubspec original e garante a instalacao das bibliotecas
          cp pubspec.backup.yaml pubspec.yaml
          flutter pub add http shared_preferences
          flutter pub get

      - name: Inserir permissao de internet no Android
        run: |
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml

      - name: Aceitar licencas do Android
        run: yes | flutter doctor --android-licenses || true

      - name: Compilar APK Release
        run: flutter build apk --release

      - name: Salvar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: CavacoCifras-Instalador
          path: build/app/outputs/flutter-apk/app-release.apk
